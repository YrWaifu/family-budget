name: family-budget

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: family_budget
      POSTGRES_USER: family_budget
      POSTGRES_PASSWORD: family_budget
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_budget -d family_budget"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://family_budget:family_budget@db:5432/family_budget?sslmode=disable}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-long-random-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      ENABLE_DEMO_DATA: ${ENABLE_DEMO_DATA:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/family-budget", "healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: family_budget_postgres_data
